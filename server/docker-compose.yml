version: '3.8'
services:
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    command: npm run dev
    volumes:
      - ./:/usr/src/app
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/chatapp
      - JWT_SECRET=your_jwt_secret_here
      - SSL_KEY=./certs/key.pem
      - SSL_CERT=./certs/cert.pem

volumes:
  mongo-data: 